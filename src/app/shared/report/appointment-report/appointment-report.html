<div class="container-fluid py-4">
    <a class="d-inline-block mb-3" [routerLink]="backLink">&larr; {{ backLabel }}</a>
    <h1 class="h3 mb-4">Referto</h1>

    <div class="row">
        <div class="col-12 col-md-10 col-xl-6">
            <app-alert-message [message]="error()"/>
            <app-alert-message [message]="success()" type="success"/>

            @switch (state()) {
                @case ('view') {
                    @if (report(); as current) {
                        <app-report-card [report]="current"/>
                    }
                }
                @case ('write') {
                    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
                        <app-form-field inputId="diagnosisText" label="Diagnosi e indicazioni" type="textarea"
                            [control]="form.controls.diagnosisText" errorText="Inserisci il testo del referto (massimo 5000 caratteri)"/>
                        <app-form-field inputId="attachmentUrl" label="Link all'allegato (facoltativo)" type="textarea"
                            [control]="form.controls.attachmentUrl" errorText="Massimo 255 caratteri"/>
                        <app-submit-button label="Salva referto" [loading]="loading()"/> 
                    </form>
                }
                @case('missing') {
                    <p class="text-muted">Il referto non è ancora disponibile.</p>
                }
                @case ('loading') {
                    <p class="text-muted">Caricamento...</p>
                }
            }
        </div>
    </div>
</div>
