<div class="container-fluid py-4">
  <h1 class="h3 mb-3">Cambia password</h1>

  @if (mustChange()) {
    <div class="alert alert-warning must-change-notice" role="alert">
      La tua password è quella iniziale, scelta da altri. Scegline una tua per continuare a usare l'applicazione.
    </div>
  }

  <div class="row">
    <div class="col-12 col-md-8 col-xl-5">
      <app-alert-message [message]="error()" />
      <app-alert-message [message]="success()" type="success" />

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <app-form-field inputId="currentPassword" label="Password attuale" type="password" autocomplete="current-password"
                        [control]="form.controls.currentPassword" errorText="Inserisci la password attuale" />
        <app-form-field inputId="newPassword" label="Nuova password" type="password" autocomplete="new-password"
                        [control]="form.controls.newPassword" errorText="Inserisci la nuova password" />
        <app-password-rules [checks]="passwordChecks()" [started]="passwordStarted()" />
        <app-form-field inputId="confirmation" label="Ripeti la nuova password" type="password" autocomplete="new-password"
                        [control]="form.controls.confirmation" errorText="Ripeti la nuova password" />
        @if (form.hasError('mismatch') && form.controls.confirmation.touched) {
          <div class="text-danger small mb-3 mismatch">Le due password non coincidono.</div>
        }

        <app-submit-button label="Cambia password" [loading]="loading()" />
      </form>
    </div>
  </div>
</div>
