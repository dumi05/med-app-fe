<app-auth-layout title="Registrazione">

    @if (error(); as message){
        <div class="alert alert-danger" role="alert">{{ message }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" formControlName="email" [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"/>
            <div class="invalid-feedback">Inserisci un'email valida.</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control" formControlName="password" [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"/>
            <div class="invalid-feedback">Inserisci una password di almeno 8 caratteri.</div>
        </div>
        <div class="mb-3">
            <label for="firstName" class="form-label">Nome</label>
            <input id="firstName" type="text" class="form-control" formControlName="firstName" [class.is-invalid]="form.controls.firstName.touched && form.controls.firstName.invalid"/>
            <div class="invalid-feedback">Inserisci il nome.</div>
        </div>
        <div class="mb-3">
            <label for="lastName" class="form-label">Cognome</label>
            <input id="lastName" type="text" class="form-control" formControlName="lastName" [class.is-invalid]="form.controls.lastName.touched && form.controls.lastName.invalid"/>
            <div class="invalid-feedback">Inserisci il cognome.</div>
        </div>
        <div class="mb-3">
            <label for="birthDate" class="form-label">Data di nascita</label>
            <input id="birthDate" type="date" class="form-control" formControlName="birthDate" [class.is-invalid]="form.controls.birthDate.touched && form.controls.birthDate.invalid"/>
            <div class="invalid-feedback">Inserisci la data di nascita.</div>
        </div>

        <div class="form-check mb-3">
            <input id="consent" type="checkbox" class="form-check-input" formControlName="gdprConsent"
                    [class.is-invalid]="form.controls.gdprConsent.touched && form.controls.gdprConsent.invalid" />
            <label for="consent" class="form-check-label">
                Ho letto l'<a routerLink="/privacy-notice" target="_blank">informativa privacy</a> (versione {{ consentVersion }})
                e acconsento al trattamento dei miei dati sanitari.
            </label>
            <div class="invalid-feedback">Il consenso è obbligatorio per registrarsi.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">Registrati</button>
    </form>

    <p class="mt-3 text-center">Hai già un account?
        <a routerLink="/login">Accedi</a>
    </p>
</app-auth-layout>
