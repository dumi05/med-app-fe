<div class="container py-5" style="max-width: 420px">
    <h1 class="h3 mb-4">Accedi</h1>

    @if (error(); as message){
        <div class="alert alert-danger" role="alert">{{ message }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" formControlName="email" [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"/>
            <div class="invalid-feedback">Inserisci un'email valida.</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control" formControlName="password" [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"/>
            <div class="invalid-feedback">Inserisci la password.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">Accedi</button>
    </form>

    <p class="mt-3 text-center">Non hai un account?
        <a routerLink="/register">Registrati</a>
    </p>
</div>
