<app-auth-layout title="Accedi">
    <app-alert-message [message]="error()"></app-alert-message>
    <app-alert-message [message]="notice()" type="success"></app-alert-message>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <app-form-field inputId="email" label="Email" type="email" autocomplete="username" [control]="form.controls.email" errorText="Inserisci l'email"/>
        <app-form-field inputId="password" label="Password" type="password" autocomplete="current-password" [control]="form.controls.password" errorText="Inserisci la password"/>

        <app-submit-button label="Accedi" [loading]="loading()"/>
    </form>

    <p class="mt-3 text-center">Non hai un account?
        <a routerLink="/register">Registrati</a>
    </p>
</app-auth-layout>
